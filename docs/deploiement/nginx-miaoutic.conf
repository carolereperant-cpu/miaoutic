# ============================================================
# nginx-miaoutic.conf - Nginx configuration for Miaoutic
# Copy to /etc/nginx/sites-available/miaoutic, replace
# miaoutic.fr by the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/miaoutic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nginx serves the React files (front) and forwards /api/ to the
# Node.js API, which listens only on 127.0.0.1 (not reachable
# from the Internet). Everything goes through HTTPS.
# ============================================================

# HTTP: redirect every request to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name miaoutic.fr www.miaoutic.fr;

    # Let's Encrypt checks the domain through this folder
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://miaoutic.fr$request_uri;
    }
}

# HTTPS
server {
    # "http2" on the listen line works with Nginx 1.22 to 1.24
    # (Debian 12, Ubuntu 24.04); with Nginx 1.25 or newer, write
    # "http2 on;" instead
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miaoutic.fr;

    # Certificate created by Let's Encrypt (certbot), renewed automatically
    ssl_certificate     /etc/letsencrypt/live/miaoutic.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miaoutic.fr/privkey.pem;
    # Only recent versions of TLS (ANSSI recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Do not reveal the version of Nginx
    server_tokens off;

    root /var/www/miaoutic/html;
    index index.html;

    # --------------------------------------------------------
    # Security headers of the front-end
    # (the API sends its own headers with Helmet)
    # --------------------------------------------------------
    # Browsers must always use HTTPS for this site (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content Security Policy: scripts, styles and fonts come only
    # from the site itself (blocks injected scripts, XSS); photos of
    # the animals may come from another https site
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Eco-design: compressed text files (about 3 times smaller)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --------------------------------------------------------
    # API: forwarded to Node.js (PM2) on the server itself
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Real IP of the visitor, used by the rate limits of the API
        # (TRUST_PROXY=1 in api/.env)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same limit as the API (express.json limit 10 kB)
        client_max_body_size 16k;
        # An add_header here replaces the headers above for /api/:
        # the API keeps only the headers sent by Helmet
        add_header X-Robots-Tag "noindex" always;
    }

    # --------------------------------------------------------
    # Front-end files
    # --------------------------------------------------------
    # Files built by Vite have a hash in their name: they never
    # change, the browser keeps them one year (eco-design)
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Single page application: an address that is not a file
    # (/animal/3, /refuge...) returns index.html, then React Router
    # shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
