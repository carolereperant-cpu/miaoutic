# ============================================================
# render.yaml - Render Blueprint (infrastructure as code)
# Describes the two services of Miaoutic on Render. In the Render
# dashboard: New > Blueprint > repository "miaoutic".
#   - miaoutic-api : the Node.js API (free web service)
#   - miaoutic     : the React front-end (free static site)
# The database is hosted by Aiven (MySQL), see
# docs/deploiement/procedure.md, chapter "Render et Aiven".
#
# Each push on the main branch is deployed automatically, but only
# once the GitHub Actions checks (lint, tests, build) have passed.
# Secrets are never written here: "sync: false" makes Render ask
# for their value in the dashboard.
# ============================================================

services:
  # ----------------------------------------------------------
  # API
  # ----------------------------------------------------------
  - type: web
    name: miaoutic-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    # Production dependencies only (no test tools)
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # Render checks this address before switching to a new version:
    # a version that cannot reach the database is not put online
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render puts a proxy in front of the API: read the real IP of
      # each visitor for the rate limits
      - key: TRUST_PROXY
        value: "1"
      # Random key generated by Render (256 bits)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: AUTH_RATE_LIMIT
        value: "10"
      # Address of the front-end, e.g. https://miaoutic.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # Aiven database (page of the service, "Connection information")
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        value: miaoutic_app
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: miaoutic
      # Certificate of Aiven, added as a "Secret File" named aiven-ca.pem
      - key: DB_SSL_CA_FILE
        value: /etc/secrets/aiven-ca.pem

  # ----------------------------------------------------------
  # Front-end
  # ----------------------------------------------------------
  - type: web
    name: miaoutic
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Address of the API, e.g. https://miaoutic-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      # Public address of the site, for sitemap.xml
      - key: SITE_URL
        sync: false
    # Single page application: an address that is not a file
    # (/animal/3, /refuge...) returns index.html, then React Router
    # shows the right page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Security headers (same as the Nginx configuration). The API is
    # on another Render address: connect-src allows *.onrender.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # Files built by Vite have a hash in their name: cached one year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
